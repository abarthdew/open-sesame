<div id="events" class="panel">
  <div class="section">
    <p class="section-title">
      Key Events
      <button class="refresh-btn" onclick="reloadEvents()">Reload</button>
    </p>
    <div class="date-filter-row">
      <input type="date" id="ev-from" class="date-input" placeholder="Start date">
      <span class="date-sep">~</span>
      <input type="date" id="ev-to"   class="date-input" placeholder="End date">
      <button class="date-query-btn" onclick="queryEvents()">Query</button>
    </div>
    <div id="events-list"><div class="loading">Loading…</div></div>
  </div>

  <div class="section">
    <p class="section-title">This Week's News Sentiment <span class="section-title-meta">Alpha Vantage · auto-updated by weekly briefing</span></p>
    <div id="news-sentiment-list"><div class="loading">Loading…</div></div>
  </div>
</div>
