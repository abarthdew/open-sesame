<div id="mypage" class="panel">
  <div class="section">
    <p class="section-title">
      Account Snapshot
      <button class="refresh-btn" onclick="reloadSnapshots()">Reload</button>
    </p>
    <div class="date-filter-row">
      <input type="date" id="mp-from" class="date-input" placeholder="Start date">
      <span class="date-sep">~</span>
      <input type="date" id="mp-to"   class="date-input" placeholder="End date">
      <button class="date-query-btn" onclick="queryMypage()">Query</button>
    </div>
    <div id="mypage-table"><div class="loading">Loading…</div></div>
  </div>

  <div class="section">
    <p class="section-title">Balance by Account (stacked bar)</p>
    <div id="mypage-bar"></div>
  </div>

  <div class="section">
    <p class="section-title">Total · Salary · Spending · Net Savings trend</p>
    <div id="mypage-line"></div>
  </div>

  <div class="section">
    <p class="section-title">Trade History</p>
    <div id="trades-table"><div class="loading">Loading…</div></div>
  </div>
</div>
