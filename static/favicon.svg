<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#14213d"/>

  <!-- Shackle: left post anchored, right post lifted open -->
  <path d="M11 17 L11 11 Q11 5.5 16 5.5 Q21 5.5 21 11 L21 13.5" fill="none" stroke="#fca311" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right post swung open (tilted up-right) -->
  <line x1="21" y1="13.5" x2="25" y2="8" stroke="#fca311" stroke-width="3" stroke-linecap="round"/>

  <!-- Lock body -->
  <rect x="7" y="17" width="18" height="13" rx="2.5" fill="#fca311"/>

  <!-- Keyhole circle -->
  <circle cx="16" cy="22" r="2.4" fill="#14213d"/>
  <!-- Keyhole slot -->
  <rect x="14.8" y="22" width="2.4" height="3.8" rx="1" fill="#14213d"/>
</svg>
