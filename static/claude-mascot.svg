<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 108">
  <!-- drop shadow -->
  <ellipse cx="60" cy="104" rx="24" ry="5" fill="rgba(0,0,0,0.10)"/>

  <!-- body -->
  <path d="M60 10 C86 8 106 28 105 58 C104 82 88 100 60 100 C32 100 16 82 15 58 C14 28 34 8 60 10Z" fill="#DA7756"/>

  <!-- top gloss -->
  <path d="M45 14 C58 11 76 16 88 30 C75 19 60 17 46 21 C37 23 28 30 24 41 C24 26 34 16 45 14Z" fill="white" opacity="0.18"/>

  <!-- left eye white -->
  <ellipse cx="44" cy="53" rx="11" ry="12" fill="white"/>
  <!-- right eye white -->
  <ellipse cx="76" cy="53" rx="11" ry="12" fill="white"/>

  <!-- left pupil -->
  <ellipse cx="46" cy="55" rx="6" ry="7" fill="#1a0805"/>
  <!-- right pupil -->
  <ellipse cx="78" cy="55" rx="6" ry="7" fill="#1a0805"/>

  <!-- eye shines -->
  <circle cx="49" cy="50" r="2.8" fill="white"/>
  <circle cx="44" cy="59" r="1.3" fill="white" opacity="0.55"/>
  <circle cx="81" cy="50" r="2.8" fill="white"/>
  <circle cx="76" cy="59" r="1.3" fill="white" opacity="0.55"/>

  <!-- blush -->
  <ellipse cx="30" cy="67" rx="9" ry="6" fill="#bf4525" opacity="0.22"/>
  <ellipse cx="90" cy="67" rx="9" ry="6" fill="#bf4525" opacity="0.22"/>

  <!-- smile -->
  <path d="M48 77 Q60 88 72 77" stroke="#7a2e10" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- left arm -->
  <path d="M18 62 Q5 52 9 38 Q13 28 23 35" stroke="#DA7756" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- right arm -->
  <path d="M102 62 Q115 52 111 38 Q107 28 97 35" stroke="#DA7756" stroke-width="9" fill="none" stroke-linecap="round"/>
</svg>
