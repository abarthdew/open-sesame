# portfolio.toml — Portfolio & Account State (Sample Data)
# Structure: account > holdings > cash
# Update rules: manage avg_price and qty only. Valuation and returns are calculated automatically.
#
# ══════════════════════════════════════════════════════════════════════════════
# Parameter Reference
# ══════════════════════════════════════════════════════════════════════════════
#
# [accounts.<alias>]         ← Account metadata
#   number       : Account number
#   broker       : Brokerage name
#   type         : "general" | "overseas" | "RP" | "domestic-note" | "ISA" | "pension-savings" | "IRP" | "gold-spot" | "housing" | "other"
#   isa_type     : (ISA only) "general" | "working-class" | "farmer-fisherman"
#   opened       : Opening date "YYYY-MM-DD"
#   annual_limit : Annual contribution limit (KRW) — ISA 20,000,000 / pension+IRP 18,000,000
#   note         : Free memo
#
# [[trades]]                    ← Closed positions (array, multiple allowed)
#   ticker     : Ticker code
#   name       : Display name
#   market     : "KR" | "US"
#   account    : Account alias (e.g. "ISA", "RP", "overseas")
#   qty        : Sold quantity
#   avg_price  : Purchase price per share (KR: KRW, US: USD)
#   sell_price : Sell price per share (KR: KRW, US: USD)
#   sell_date  : "YYYY-MM-DD"
#   tax        : Tax paid (KRW) — 0 if omitted
#
# [[accounts.<alias>.holdings]]  ← Holdings (array, multiple allowed)
#   ticker       : Ticker code (KR: 6-digit number | US: symbol)
#   name         : Display name
#   market       : "KR" | "US"
#   qty          : Quantity held (shares / units)
#   avg_price    : Average purchase price per share (KR: KRW, US: USD)
#   total_cost   : Use only when qty is unknown — total purchase amount (KRW)
#
# [accounts.<alias>.cash]        ← Cash balance
#   KRW          : KRW balance
#   USD          : USD balance
#   memo         : Memo
#
# ══════════════════════════════════════════════════════════════════════════════

[meta]
updated      = "2026-01-01" # required
salary_krw   = 0
spending_krw = 0
tax_krw      = 0

