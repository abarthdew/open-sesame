name: Slack 보고서 알림

on:
  push:
    branches: [main]
    paths:
      - 'schedule/**'
      - 'history/events.toml'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Slack 알림 전송
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL_ERR }}" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"✅ [open-sesame] ${{ github.event.head_commit.message }}\"}"
