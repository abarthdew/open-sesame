name: Auto-merge claude/* PRs

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

jobs:
  auto-merge:
    if: startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge and delete branch
        run: |
          gh pr ready ${{ github.event.pull_request.number }} 2>/dev/null || true
          gh pr merge ${{ github.event.pull_request.number }} --rebase --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Notify Slack if schedule/events touched
        if: success()
        run: |
          FILES=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files[].path')
          if echo "$FILES" | grep -qE '^(schedule/|history/events\.toml)'; then
            TITLE="${{ github.event.pull_request.title }}"
            PAYLOAD=$(jq -nc --arg text "✅ [open-sesame] $TITLE" '{text: $text}')
            curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL_ERR }}" \
              -H 'Content-type: application/json' \
              -d "$PAYLOAD"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
